name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      # Marker smoke: unknown markers must fail collection; empty selection is OK.
      - run: pytest -m governance --collect-only
      - run: pytest -m "idempotency or permit or recovery or eval" --collect-only
      - run: python -c "from pathlib import Path; assert Path('docs/definitions/REGENT-DEFINITION-1.0.txt').is_file()"
      # definition freeze covered by tests/architecture/test_regent_definition_freeze.py
