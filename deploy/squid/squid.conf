# Regent controlled egress ACL (platform safety), not a Core product feed catalog.
# HTTP evidence fetches only when Goal authorizes URLs whose hosts are also allowed here.

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Evidence / package hosts Regent is allowed to reach.
acl evidence_domains dstdomain .techcrunch.com
acl evidence_domains dstdomain .theverge.com
acl evidence_domains dstdomain .hnrss.org
acl evidence_domains dstdomain .bbci.co.uk
acl evidence_domains dstdomain .cnn.com
acl evidence_domains dstdomain .reddit.com
acl evidence_domains dstdomain .pypi.org
acl evidence_domains dstdomain .pythonhosted.org
acl evidence_domains dstdomain .files.pythonhosted.org
acl evidence_domains dstdomain .github.com
acl evidence_domains dstdomain .githubusercontent.com
acl evidence_domains dstdomain .aliyun.com
acl evidence_domains dstdomain .aliyuncs.com

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet evidence_domains
http_access deny all

http_port 3128
coredump_dir /var/spool/squid
refresh_pattern . 0 20% 4320
dns_v4_first on
