server {
  listen 80; root /usr/share/nginx/html; index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /v1/ { proxy_pass http://regent-api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health/ { proxy_pass http://regent-api:8000; proxy_set_header Host $host; }
}
