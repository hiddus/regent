<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Regent · 对话工作区</title>
  <style>
    :root{color-scheme:dark;--bg:#151515;--side:#0f0f0f;--panel:#212121;--hover:#2b2b2b;--line:#343434;--text:#ececec;--muted:#a8a8a8;--accent:#10a37f;--danger:#f36b7f;--warn:#f5a623;--info:#5b9bd5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:10px;padding:18px;font-weight:700}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:white}.new{margin:0 12px 14px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.new:hover,.thread:hover{background:var(--hover)}.threads{overflow:auto;padding:0 8px;flex:1}.thread{display:flex;align-items:center;gap:8px;width:100%;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.thread.active{background:var(--hover)}.thread-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.dot-active{background:var(--accent)}.dot-paused{background:var(--warn)}.dot-waiting{background:var(--info)}.dot-terminal{background:var(--muted);opacity:.5}.sidefoot{padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.main{display:grid;grid-template-rows:auto auto 1fr auto;min-width:0}.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;flex:1}.health{font-size:13px;color:var(--muted);white-space:nowrap}.health.ok{color:#65d9bb}.health.bad{color:var(--danger)}.stage-bar{display:flex;align-items:center;gap:8px;padding:8px 22px;border-bottom:1px solid var(--line);background:var(--side);font-size:13px;min-height:40px}.stage-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12px}.stage-badge.active{border-color:var(--accent);color:var(--accent)}.stage-badge.paused{border-color:var(--warn);color:var(--warn)}.stage-badge.waiting{border-color:var(--info);color:var(--info)}.stage-badge.terminal{opacity:.6}.quick-actions{display:flex;gap:6px;margin-left:auto}.qa-btn{padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}.qa-btn:hover{background:var(--hover);border-color:var(--muted)}.qa-btn.danger{color:var(--danger);border-color:var(--danger)}.qa-btn:disabled{opacity:.4;cursor:not-allowed}.messages{overflow:auto;padding:30px 20px 140px}.stream{max-width:780px;margin:auto}.empty{text-align:center;margin:15vh auto;color:var(--muted)}.empty h1{color:var(--text);font-size:30px;margin-bottom:8px}.prompt{margin-top:24px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:transparent;color:var(--text);cursor:pointer}.prompt:hover{background:var(--hover)}article.message{display:flex;gap:12px;margin-bottom:18px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}.message.user .avatar{background:#2b2b2b}.message.assistant .avatar,.message.event .avatar{background:var(--accent);color:white}.body{min-width:0;flex:1}.meta{font-size:12px;color:var(--muted);margin-bottom:3px}.content{word-wrap:break-word;white-space:pre-wrap}.details{margin-top:8px;padding:10px;border-radius:8px;background:#1a1a1a;font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:200px;overflow:auto}.confirm-card{margin-top:12px;padding:18px;border:1px solid #3d5f56;border-radius:14px;background:#19231f}.confirm-card h3{margin:0 0 12px}.facts{display:grid;grid-template-columns:120px 1fr;gap:8px 14px}.facts dt{color:var(--muted)}.facts dd{margin:0}.confirm{margin-top:16px;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.confirm:disabled{opacity:.45}.confirm-note{margin-top:16px;color:#65d9bb;font-size:14px}.confirm-error{margin-top:12px;padding:10px 12px;border-radius:8px;background:#2a1518;color:var(--danger);font-size:13px}.preview-link{display:inline-block;margin-top:12px;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;font-weight:700;text-decoration:none}.task-card{margin-top:12px;padding:14px;border:1px solid var(--info);border-radius:12px;background:#161e2a}.task-card h4{margin:0 0 8px;color:var(--info)}.task-actions{display:flex;gap:8px;margin-top:10px}.task-btn{padding:6px 14px;border:0;border-radius:8px;font-weight:600;cursor:pointer}.task-btn.approve{background:var(--accent);color:white}.task-btn.reject{background:var(--danger);color:white}.correction-card{margin-top:10px;padding:10px 14px;border-left:3px solid var(--warn);background:#1f1a14;border-radius:0 8px 8px 0;font-size:13px}.correction-card .ct-label{color:var(--warn);font-weight:600}.composer-wrap{border-top:1px solid var(--line);background:var(--bg);padding:12px 20px 20px}.composer{max-width:780px;margin:auto;border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--panel)}.composer textarea{width:100%;border:0;background:transparent;color:var(--text);font:inherit;resize:none;outline:0;min-height:24px;max-height:200px}.actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.actions .hint{font-size:12px;color:var(--muted)}.send{border:0;border-radius:8px;width:32px;height:32px;background:var(--accent);color:white;font-size:16px;cursor:pointer;display:grid;place-items:center}.send:disabled{opacity:.4}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;width:280px;height:100vh;z-index:10}.mobile-menu{display:block}.stage-bar{overflow-x:auto}}.mobile-menu{display:none;background:transparent;border:0;color:var(--text);font-size:20px;cursor:pointer}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="mark">R</span> Regent</div>
    <button class="new" id="newChat">＋ 新建 App</button>
    <div class="threads" id="threads"></div>
    <div class="sidefoot">所有对话、执行与决策均持久保存</div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="mobile-menu" id="menu">☰</button>
      <div class="title" id="title">新任务</div>
      <div class="health" id="health">正在连接…</div>
    </header>
    <div class="stage-bar" id="stageBar">
      <span class="stage-badge" id="stageBadge">—</span>
      <div class="quick-actions" id="quickActions"></div>
    </div>
    <section class="messages" id="messages"><div class="stream" id="stream"></div></section>
    <div class="composer-wrap"><div class="composer"><textarea id="input" placeholder="描述目标，或指导 Regent 调整方向…" rows="1"></textarea><div class="actions"><span class="hint" id="hint">Enter 发送，Shift + Enter 换行</span><button class="send" id="send" aria-label="发送">↑</button></div></div></div>
  </main>
</div>
<script>
const newId=()=>{const c=window.crypto||window.msCrypto;if(c&&typeof c.randomUUID==='function')return c.randomUUID();const b=new Uint8Array(16);if(c&&typeof c.getRandomValues==='function')c.getRandomValues(b);else for(let i=0;i<b.length;i++)b[i]=Math.floor(Math.random()*256);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)};
const $=id=>document.getElementById(id),actor='trial-user';let current=null,currentProject=null,currentStatus=null,conversations=[],projects=[],lastMessages=[];
const api=async(path,body,method)=>{const r=await fetch(path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={message:text}}if(!r.ok)throw new Error(data?.error?.message||data?.detail||`${r.status} ${text}`);return data};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STAGE_LABELS={
  'NOT_STARTED':'未开始','QUEUED':'排队中','DISCOVERING':'产品发现中','DECIDED':'方案已决策',
  'RESOLVED':'能力已解析','GENERATING':'代码生成中','SNAPSHOT_READY':'快照就绪',
  'BUILD_PASSED':'构建通过','DEPLOYED':'预览已部署','RESEARCH_MORE':'研究中',
  'PREVIEW_SUCCEEDED':'预览成功','GATE_INSUFFICIENT_EVIDENCE':'证据不足',
  'GATE_PASSED':'门禁通过','GATE_FAILED':'门禁未通过','FAILED':'失败'
};

function setHint(text,isError=false){$('hint').textContent=text;$('hint').style.color=isError?'var(--danger)':''}

async function health(){try{const h=await api('/health/ready');$('health').textContent=`${h.environment||'dev'} · 服务正常`;$('health').className='health ok'}catch{$('health').textContent='服务不可用';$('health').className='health bad'}}

function goalStatusDot(status){
  if(status==='ACTIVE')return 'dot-active';
  if(status==='PAUSED')return 'dot-paused';
  if(status==='WAITING_HUMAN')return 'dot-waiting';
  return 'dot-terminal';
}

function renderThreads(){$('threads').innerHTML=projects.map(p=>`<button class="thread ${currentProject?.id===p.id?'active':''}" data-id="${p.id}"><span class="thread-dot ${goalStatusDot(p.status)}"></span><span class="thread-name">${esc(p.name)}</span></button>`).join('');document.querySelectorAll('.thread').forEach(b=>b.onclick=()=>openProject(b.dataset.id))}

function goalAlreadyMoving(items,goalId){
  return items.some(m=>{
    const mid=m.metadata?.goal_id;
    if(mid&&mid!==goalId)return false;
    const t=m.message_type||'';
    return t==='GOAL_CONFIRMED'||t==='GOAL_EXECUTION_QUEUED'||t.startsWith('GOAL_EXECUTION_')||t==='PREVIEW_READY'||t==='PREVIEW_DEPLOYMENT_SUCCEEDED';
  });
}

function publicPreviewUrl(endpoint){
  if(!endpoint)return '';
  try{
    const u=new URL(endpoint,location.origin);
    if(u.hostname==='regent-api'||u.hostname==='localhost'||u.hostname==='127.0.0.1'){
      return location.origin+u.pathname+u.search+u.hash;
    }
    return u.toString();
  }catch{return String(endpoint).replace('http://regent-api:8000',location.origin).replace('https://regent-api:8000',location.origin)}
}

function confirmationCard(m,canConfirm){
  const u=m.metadata?.understanding||{};
  const criteria=Object.entries(u.success_criteria||{}).map(([k,v])=>`${esc(k)}：${esc(v)}`).join('<br>')||'等待补充';
  const action=canConfirm
    ?`<button type="button" class="confirm" data-project="${esc(m.metadata.app_project_id)}" data-goal="${esc(m.metadata.goal_id)}" data-hash="${esc(m.metadata.goal_spec_hash||'')}">确认并开始</button><div class="confirm-error" hidden></div>`
    :`<p class="confirm-note">已确认并开始执行。请向下查看任务进展；无需再次点击。</p>`;
  return `<div class="confirm-card"><h3>我理解的产品</h3><dl class="facts"><dt>App 名称</dt><dd>${esc(u.app_name)}</dd><dt>目标用户</dt><dd>${esc(u.target_users)}</dd><dt>解决问题</dt><dd>${esc(u.problem)}</dd><dt>首轮交付</dt><dd>${esc(u.first_deliverable)}</dd><dt>成功标准</dt><dd>${criteria}</dd><dt>明确约束</dt><dd>${esc(JSON.stringify(u.explicit_constraints||{}))}</dd></dl>${action}</div>`;
}

function taskCard(task){
  return `<div class="task-card"><h4>📋 ${esc(task.task_type)}</h4><p>${esc(task.prompt)}</p><div class="task-actions"><button class="task-btn approve" data-task-id="${esc(task.id)}">批准</button><button class="task-btn reject" data-task-id="${esc(task.id)}">拒绝</button></div></div>`;
}

function correctionCard(m){
  const t=m.metadata||{};
  return `<div class="correction-card"><span class="ct-label">修正 [${esc(t.correction_target||'other')}]</span>: ${esc(t.correction_detail||'')}</div>`;
}

function messageHtml(m,items){
  const awaiting=m.message_type==='APP_CONFIRMATION_REQUIRED'&&!goalAlreadyMoving(items,m.metadata?.goal_id);
  const card=m.message_type==='APP_CONFIRMATION_REQUIRED'?confirmationCard(m,awaiting):'';
  const previewEndpoint=(m.message_type==='PREVIEW_READY'||m.message_type==='PREVIEW_DEPLOYMENT_SUCCEEDED')?m.metadata?.endpoint:'';
  const preview=previewEndpoint?`<p><a class="preview-link" href="${esc(publicPreviewUrl(previewEndpoint))}" target="_blank" rel="noopener">打开 App 预览</a></p>`:'';
  const correction=m.message_type==='CORRECTION_APPLIED'?correctionCard(m):'';
  const details=(m.message_type==='APP_CONFIRMATION_REQUIRED'||m.message_type==='CORRECTION_APPLIED')?'':(Object.keys(m.metadata||{}).length>0?`<div class="details">${esc(JSON.stringify(m.metadata,null,2))}</div>`:'');
  return `<article class="message ${m.role.toLowerCase()}"><div class="avatar">${m.role==='USER'?'你':m.role==='EVENT'?'E':'R'}</div><div class="body"><div class="meta">${m.role==='USER'?'你':m.role==='EVENT'?'任务进展':'Regent'}</div><div class="content">${esc(m.content)}</div>${card}${correction}${preview}${details}</div></article>`;
}

function renderMessages(items=[]){
  lastMessages=items;
  if(!current){$('stream').innerHTML='<div class="empty"><h1>创建你的第一个 App</h1><p>先描述产品想法。Core 会展示理解卡，只有确认后才开始执行。</p><button class="prompt" id="selfImprove">让 Regent 检查并改进自身</button></div>';$('selfImprove').onclick=()=>{$('input').value='检查 Regent 当前最重要的产品或工程缺口，提出一个可验证的改进假设，在隔离环境实现并验证；不要修改生产环境或降低治理要求。';$('input').focus()};return}
  $('stream').innerHTML=items.length?items.map(m=>messageHtml(m,items)).join(''):'<div class="empty"><h1>描述这个 App</h1></div>';
  document.querySelectorAll('button.confirm').forEach(b=>b.onclick=()=>confirmAndStart(b));
  document.querySelectorAll('button.task-btn').forEach(b=>b.onclick=()=>handleTaskAction(b));
  $('messages').scrollTop=$('messages').scrollHeight;
}

function renderStageBar(){
  if(!currentStatus){$('stageBadge').textContent='—';$('stageBadge').className='stage-badge';$('quickActions').innerHTML='';return}
  const goal=currentStatus.goal||{};
  const status=goal.status||'UNKNOWN';
  const meta=goal.metadata||{};
  const stage=meta.execution_stage||currentStatus.goal?.execution_stage?.stage||status;
  const label=STAGE_LABELS[stage]||stage;
  const cls=status==='ACTIVE'?'active':status==='PAUSED'?'paused':status==='WAITING_HUMAN'?'waiting':'terminal';
  $('stageBadge').textContent=`${label} · ${status}`;
  $('stageBadge').className=`stage-badge ${cls}`;

  // Quick actions
  let actions='';
  if(status==='ACTIVE'){
    actions+=`<button class="qa-btn" onclick="sendQuick('暂停执行')">暂停</button>`;
  }
  if(status==='PAUSED'){
    actions+=`<button class="qa-btn" onclick="sendQuick('恢复执行')">恢复</button>`;
  }
  if(status==='WAITING_HUMAN'){
    actions+=`<button class="qa-btn" onclick="sendQuick('批准')">批准</button>`;
    actions+=`<button class="qa-btn danger" onclick="sendQuick('拒绝，需要修改')">拒绝</button>`;
  }
  if(meta.active_corrections&&meta.active_corrections.length>0){
    actions+=`<span style="color:var(--warn);font-size:12px">修正 ×${meta.active_corrections.length}</span>`;
  }
  $('quickActions').innerHTML=actions;
}

window.sendQuick=function(text){$('input').value=text;$('input').focus();send()};

async function handleTaskAction(button){
  const taskId=button.dataset.taskId;
  const isApprove=button.classList.contains('approve');
  try{
    if(isApprove){
      await api(`/v1/human-tasks/${taskId}/complete`,{assigned_to:actor,response:{approved:true}});
    }else{
      const reason=prompt('请输入拒绝原因：')||'未提供原因';
      await api(`/v1/human-tasks/${taskId}/complete`,{assigned_to:actor,response:{approved:false,rejection_reason:reason}});
    }
    await refresh();
    setHint(isApprove?'已批准':'已拒绝');
  }catch(e){setHint(e.message,true)}
}

async function loadWorkspace(openFirst=true){
  [projects,conversations]=await Promise.all([api('/v1/app-projects'),api('/v1/conversations')]);
  renderThreads();
  if(openFirst&&!current&&projects.length)await openProject(projects[0].id);
  else if(!projects.length)renderMessages();
}

async function openProject(id){
  currentProject=projects.find(p=>p.id===id)||await api(`/v1/app-projects/${id}`);
  current=conversations.find(c=>c.app_project_id===id)||null;
  $('title').textContent=currentProject.name;
  renderThreads();
  renderMessages(current?await api(`/v1/conversations/${current.id}/messages`):[]);
  $('sidebar').classList.remove('open');
  // Fetch status for stage bar
  try{currentStatus=await api(`/v1/app-projects/${id}/status`);renderStageBar();$('title').textContent=`${currentProject.name} · ${currentStatus.goal?.status||''}`}catch{}
}

async function record(role,content,message_type='TEXT',metadata={}){return api(`/v1/conversations/${current.id}/messages`,{role,message_type,content,actor,metadata:{...metadata,idempotency_key:'console-'+newId()}})}
async function refresh(){if(current)renderMessages(await api(`/v1/conversations/${current.id}/messages`))}
async function createAppDraft(idea){
  setHint('Core 正在形成产品理解草案…');
  const draft=await api('/v1/app-projects/drafts',{idea,actor});
  await loadWorkspace(false);
  currentProject=projects.find(p=>p.id===draft.project.id)||draft.project;
  current=conversations.find(c=>c.id===draft.conversation_id)||await api(`/v1/conversations/${draft.conversation_id}`);
  $('title').textContent=`${currentProject.name} · 待确认`;
  setHint('确认前不会开始规划、生成或发布');
  renderThreads();
  await refresh();
}

function showCardError(button,message){
  const box=button.parentElement?.querySelector('.confirm-error');
  if(box){box.hidden=false;box.textContent=message}
  setHint(message,true);
}

async function confirmAndStart(button){
  if(button.disabled)return;
  button.disabled=true;
  const errBox=button.parentElement?.querySelector('.confirm-error');
  if(errBox){errBox.hidden=true;errBox.textContent=''}
  try{
    const projectId=button.dataset.project,goalId=button.dataset.goal;
    if(!projectId||!goalId)throw new Error('确认信息不完整，请刷新页面后重试');
    let hash=button.dataset.hash;
    if(!hash){const state=await api(`/v1/app-projects/${projectId}/status`);hash=state.goal_spec?.content_hash}
    if(!hash)throw new Error('缺少目标版本哈希，请刷新后重试');
    const confirmed=await api(`/v1/app-projects/${projectId}/confirm`,{actor,expected_spec_hash:hash});
    currentProject=confirmed.project;
    try{
      await api(`/v1/goals/${goalId}/start`,{actor,idempotency_key:'console-start-'+goalId});
    }catch(startErr){
      const msg=String(startErr.message||startErr);
      if(/startable or retryable/i.test(msg)){
        setHint('该目标已在执行中，请向下查看任务进展');
        await loadWorkspace(false);
        await openProject(projectId);
        return;
      }
      throw startErr;
    }
    setHint('Core 已开始执行，你无需继续操作');
    await loadWorkspace(false);
    await openProject(projectId);
  }catch(e){
    showCardError(button,e.message||String(e));
  }finally{
    button.disabled=false;
  }
}

async function send(){
  const text=$('input').value.trim();
  if(!text||$('send').disabled)return;
  $('send').disabled=true;
  $('input').value='';
  $('input').style.height='auto';
  try{
    if(!current){
      await createAppDraft(text);
    }else{
      setHint('Core 正在处理你的指令…');
      const result=await api(`/v1/app-projects/${currentProject.id}/guidance`,{message:text,actor});
      await refresh();
      if(result.requires_confirmation){
        setHint('目标已修订，请确认新版本后继续');
      }else if(result.command_type==='PAUSE'){
        setHint('已暂停。可发送修正或恢复指令。');
      }else if(result.command_type==='RESUME'){
        setHint('已恢复执行。');
      }else if(result.command_type==='CORRECT'){
        setHint('修正已记录，将在下一步执行中生效。');
      }else if(result.command_type==='APPROVE'){
        setHint('已批准，目标继续执行。');
      }else if(result.command_type==='REJECT'){
        setHint('已拒绝，Core 将重新规划。');
      }else{
        setHint('Enter 发送，Shift + Enter 换行');
      }
      // Refresh status for stage bar
      try{currentStatus=await api(`/v1/app-projects/${currentProject.id}/status`);renderStageBar()}catch{}
    }
  }catch(e){
    setHint(e.message,true);
  }finally{
    $('send').disabled=false;
  }
}

// Auto-resize textarea
$('input').oninput=function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,200)+'px'};
$('send').onclick=send;
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('newChat').onclick=()=>{current=null;currentProject=null;currentStatus=null;$('title').textContent='新建 App';renderThreads();renderMessages();renderStageBar();$('input').focus()};
$('menu').onclick=()=>$('sidebar').classList.toggle('open');

renderMessages();
health();
loadWorkspace().catch(()=>setHint('暂时无法加载 App 历史，请稍后重试',true));

// Polling: refresh status + messages
setInterval(async()=>{
  if(!currentProject)return;
  try{
    const state=await api(`/v1/app-projects/${currentProject.id}/status`);
    currentStatus=state;
    renderStageBar();
    const goal=state.goal||{};
    const meta=goal.metadata||{};
    const stage=meta.execution_stage||state.goal?.execution_stage?.stage||goal.status;
    $('title').textContent=`${currentProject.name} · ${goal.status||''}`;
    // Context-aware hints
    if(meta.awaiting_authorized_sources){
      setHint('可选: 粘贴授权来源 URL 覆盖');
    }else if(goal.status==='PAUSED'){
      setHint('已暂停 — 发送"恢复"继续，或输入修正指令');
    }else if(goal.status==='WAITING_HUMAN'){
      setHint('等待你的批准或拒绝 — 点击任务卡片操作');
    }else if(stage==='RESEARCH_MORE'){
      setHint('正在绑定认证证据能力并自适应继续发现…');
    }else if(state.preview?.status==='PREVIEW_READY'||meta.last_preview_endpoint){
      setHint('预览已就绪，可以开始真实体验验证');
    }else if(state.preview?.status==='FAILED'){
      setHint(state.preview.failure_summary||'生成失败，可以发送"继续"安全重试',true);
    }
    await refresh();
    // Update project list status dots
    projects=await api('/v1/app-projects');
    renderThreads();
  }catch{}
},3000);
</script>
</body>
</html>
